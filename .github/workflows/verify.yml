name: Verify public client

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Boundary, tests, audit, and exports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: witness
          POSTGRES_PASSWORD: witness
          POSTGRES_DB: witness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U witness -d witness"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WITNESS_TEST_DATABASE_URL: postgresql://witness:witness@localhost:5432/witness
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject newly introduced vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install the pinned package manager
        run: npm install --global pnpm@11.7.0

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update

      - name: Install Go 1.26.5 for the pinned Tessera service
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: packages/volna-key-transparency-log/go.sum

      - name: Reject the vulnerable unused Rust provider from the selected graph
        shell: bash
        run: |
          if rustup run 1.88.0 cargo tree --locked --manifest-path packages/volna-messaging-client/rust/openmls-evaluation/Cargo.toml --invert libcrux-chacha20poly1305 --prefix none | grep -q '^libcrux-chacha20poly1305 '; then
            echo 'libcrux-chacha20poly1305 must remain outside the selected OpenMLS feature graph' >&2
            exit 1
          fi

      - name: Verify source boundary, types, and tests
        run: pnpm verify

      - name: Verify witness PostgreSQL compare-and-swap
        run: pnpm test:witness:postgres

      - name: Verify the C2SP key-transparency log
        run: go test ./...
        working-directory: packages/volna-key-transparency-log

      - name: Verify the pinned OpenMLS evaluation
        run: rustup run 1.88.0 pnpm verify:openmls

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Export Web
        run: pnpm export:web

      - name: Export Android bundle
        run: pnpm export:android

      - name: Export iOS bundle
        run: pnpm export:ios

      - name: Build the witness container
        run: docker build --file packages/volna-key-directory-witness/Dockerfile --tag volna-key-directory-witness:ci .

      - name: Scan the witness container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: volna-key-directory-witness:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build the key-transparency log container
        run: docker build --file packages/volna-key-transparency-log/Dockerfile --tag volna-key-transparency-log:ci packages/volna-key-transparency-log

      - name: Scan the key-transparency log container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: volna-key-transparency-log:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
