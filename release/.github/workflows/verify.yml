name: Verify public client

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Boundary, tests, audit, and exports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Reject newly introduced vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install the pinned package manager
        run: npm install --global pnpm@11.7.0

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update

      - name: Verify source boundary, types, and tests
        run: pnpm verify

      - name: Verify the pinned OpenMLS evaluation
        run: rustup run 1.88.0 pnpm verify:openmls

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Export Web
        run: pnpm export:web

      - name: Export Android bundle
        run: pnpm export:android

      - name: Export iOS bundle
        run: pnpm export:ios
