[package]
name = "volna-openmls-evaluation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
openmls = { version = "=0.8.1" }
openmls_basic_credential = { version = "=0.5.0", features = ["clonable"] }
openmls_rust_crypto = { version = "=0.5.1" }
openmls_traits = { version = "=0.5.0" }
tls_codec = { version = "=0.4.2", features = ["derive", "serde", "mls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_old = { package = "getrandom", version = "=0.2.17", features = ["js"] }
openmls = { version = "=0.8.1", features = ["js"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
