plugins {
  id 'com.android.library' version '8.9.1'
  id 'org.jetbrains.kotlin.android' version '2.1.20'
}
def generated = providers.gradleProperty('matrixGeneratedDir').get()
android {
  namespace 'org.matrix.rustcomponents.sdk'
  compileSdk 35
  defaultConfig { minSdk 24; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
  sourceSets {
    main {
      java.srcDirs = [generated + '/kotlin']
      jniLibs.srcDirs = [generated + '/jniLibs']
    }
    androidTest.java.srcDirs = ['../android-tests']
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}
dependencies {
  implementation 'net.java.dev.jna:jna:5.18.1@aar'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
  implementation 'androidx.annotation:annotation:1.9.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
