<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="ВОЛНА" />
    <meta name="lava-verify" content="14390e52a0db66e1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ВОЛНА" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="VOLNA — социальная сеть и городской гид для творческого сообщества."
    />

    <link rel="manifest" href="/manifest.json?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa/icon-512.png?v=3" />

    <title>%WEB_TITLE%</title>

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
      }

      #root {
        display: flex;
        min-height: 100%;
        height: 100%;
        flex: 1;
      }

      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }

      /* WebKit reports dvh/svh without the bottom safe area for installed
         viewport-fit=cover apps. In standalone mode 100vh is the physical
         app viewport and keeps the application surface behind both insets. */
      @media all and (display-mode: standalone) {
        html,
        body {
          height: 100vh;
          min-height: 100vh;
        }

        #root {
          position: fixed;
          inset: 0;
          bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
          width: 100%;
          height: auto;
          min-height: 0;
        }
      }

      /* Safari 26 only composites page artwork underneath its translucent
         browser controls when the root document owns the viewport scroll.
         The authenticated RN shell intentionally remains internally scrolled;
         auth uses this document mode so its canvas can continue edge-to-edge. */
      html.volna-auth-document,
      html.volna-auth-document body {
        height: auto;
        min-height: 100lvh;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: auto;
      }

      html.volna-auth-document #root {
        height: auto;
        min-height: 100lvh;
      }

      html.volna-auth-document,
      html.volna-auth-document body,
      html.volna-auth-document [data-testid="volna-auth-scroll"] {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      html.volna-auth-document::-webkit-scrollbar,
      html.volna-auth-document body::-webkit-scrollbar,
      html.volna-auth-document [data-testid="volna-auth-scroll"]::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      .volna-boot { box-sizing: border-box; display: flex; width: 100%; min-height: 100%; padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom)); align-items: center; justify-content: center; background: #fff; color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .volna-boot__content { width: min(280px, 100%); text-align: center; }
      .volna-boot__brand { margin: 0 0 26px; font-size: 25px; font-weight: 500; letter-spacing: 0.36em; text-indent: 0.36em; }
      /* VOLNA_LOADING_START — generated from loading-tokens.js */
      .volna-boot__loader { position: relative; width: 32px; height: 32px; margin: 0 auto; color: #111; }
      .volna-boot__loader::before, .volna-boot__loader::after { content: ''; position: absolute; inset: 0; box-sizing: border-box; border: 2px solid currentColor; border-radius: 50%; }
      .volna-boot__loader::before { opacity: 0.18; }
      .volna-boot__loader::after { border-left-color: transparent; animation: volna-loading 900ms linear infinite; }
      .volna-boot--failed .volna-boot__loader { display: none; }
      @keyframes volna-loading { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .volna-boot__loader::after { animation: none; } }
      /* VOLNA_LOADING_END */
      .volna-boot__title { margin: 16px 0 0; font-size: 14px; font-weight: 600; }
      .volna-boot__note { margin: 5px 0 0; color: #888; font-size: 12px; line-height: 17px; }
      .volna-boot__retry { display: none; width: 100%; margin-top: 18px; border: 0; border-radius: 22px; padding: 12px 16px; background: #111; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
      .volna-boot--slow .volna-boot__retry, .volna-boot--failed .volna-boot__retry { display: block; }

      .volna-orientation-guard {
        display: none;
      }

      /* iOS Home Screen web apps may ignore the manifest orientation lock.
         Keep phone layouts portrait-only instead of allowing a broken landscape UI. */
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
        #root {
          visibility: hidden;
        }

        .volna-orientation-guard {
          position: fixed;
          z-index: 2147483647;
          inset: 0;
          box-sizing: border-box;
          display: flex;
          padding:
            max(24px, env(safe-area-inset-top))
            max(24px, env(safe-area-inset-right))
            max(24px, env(safe-area-inset-bottom))
            max(24px, env(safe-area-inset-left));
          align-items: center;
          justify-content: center;
          background: #111;
          color: #fff;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          text-align: center;
        }

        .volna-orientation-guard__content {
          max-width: 320px;
        }

        .volna-orientation-guard__phone {
          width: 34px;
          height: 54px;
          margin: 0 auto 18px;
          border: 2px solid currentColor;
          border-radius: 8px;
        }

        .volna-orientation-guard__title {
          margin: 0;
          font-size: 18px;
          line-height: 24px;
          font-weight: 600;
        }

        .volna-orientation-guard__text {
          margin: 6px 0 0;
          color: rgba(255,255,255,0.7);
          font-size: 14px;
          line-height: 20px;
        }
      }

      .event-schedule-scroll {
        scrollbar-color: #b8b8b8 #eeeeee;
        scrollbar-width: auto;
      }

      .event-schedule-scroll::-webkit-scrollbar {
        height: 10px;
      }

      .event-schedule-scroll::-webkit-scrollbar-track {
        background: #eeeeee;
      }

      .event-schedule-scroll::-webkit-scrollbar-thumb {
        min-width: 48px;
        border: 2px solid #eeeeee;
        border-radius: 8px;
        background: #b8b8b8;
      }
    </style>
  </head>

  <body>
    <noscript>Для работы VOLNA необходимо включить JavaScript.</noscript>
    <div id="root"><div class="volna-boot" role="status" aria-live="polite"><div class="volna-boot__content"><p class="volna-boot__brand">ВОЛНА</p><div class="volna-boot__loader" aria-hidden="true"></div><p class="volna-boot__title">Загружаем приложение</p><p class="volna-boot__note">Первый запуск может занять несколько секунд</p><button class="volna-boot__retry" type="button">Попробовать снова</button></div></div></div>
    <div class="volna-orientation-guard" role="alert" aria-live="polite">
      <div class="volna-orientation-guard__content">
        <div class="volna-orientation-guard__phone" aria-hidden="true"></div>
        <p class="volna-orientation-guard__title">Поверните телефон</p>
        <p class="volna-orientation-guard__text">VOLNA работает в вертикальном режиме.</p>
      </div>
    </div>
    <script>
      (function () {
        var slowTimer;
        var failureTimer;
        var observer;

        function getBootElement() {
          return document.querySelector('.volna-boot');
        }

        function showStatus(failed) {
          var boot = getBootElement();
          if (!boot) return;
          boot.classList.add(failed ? 'volna-boot--failed' : 'volna-boot--slow');
          var title = boot.querySelector('.volna-boot__title');
          var note = boot.querySelector('.volna-boot__note');
          var retry = boot.querySelector('.volna-boot__retry');
          if (title) title.textContent = failed ? 'Не удалось запустить приложение' : 'Загрузка занимает больше времени';
          if (note) {
            note.textContent = navigator.onLine
              ? (failed ? 'Не удалось завершить запуск. Проверьте подключение к интернету и попробуйте снова.' : 'Приложение продолжает загружаться. На медленном соединении это может занять больше времени.')
              : 'Нет подключения к интернету. Проверьте соединение и загрузите приложение снова.';
          }
          if (retry) {
            retry.textContent = failed ? 'Попробовать снова' : 'Загрузить заново';
            retry.onclick = function () {
              window.location.reload();
            };
          }
        }

        function showFailure() {
          window.clearTimeout(slowTimer);
          window.clearTimeout(failureTimer);
          showStatus(true);
        }

        function onError(event) {
          if (!getBootElement()) return;
          if ((event.target && event.target.tagName === 'SCRIPT') || event.target === window) {
            showFailure();
          }
        }

        function finishIfReady() {
          if (getBootElement()) return;
          window.clearTimeout(slowTimer);
          window.clearTimeout(failureTimer);
          if (observer) observer.disconnect();
          window.removeEventListener('error', onError, true);
          window.removeEventListener('unhandledrejection', showFailure);
          window.removeEventListener('load', finishIfReady);
        }

        window.addEventListener('error', onError, true);
        window.addEventListener('unhandledrejection', showFailure);
        // Never reload a pending script automatically: on slow LTE a timed
        // reload throws away downloaded bytes and starts the same transfer over.
        slowTimer = window.setTimeout(function () { showStatus(false); }, 25000);
        failureTimer = window.setTimeout(showFailure, 60000);
        window.addEventListener('load', finishIfReady);
        if (typeof MutationObserver !== 'undefined') {
          observer = new MutationObserver(finishIfReady);
          observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        }
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').catch(function (error) {
            console.warn('[VOLNA PWA] Service Worker не зарегистрирован:', error);
          });
        });
      }
    </script>
  </body>
</html>
